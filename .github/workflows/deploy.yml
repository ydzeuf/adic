name: Deploy ADIC site to GoDaddy

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: adic-production-deploy
  cancel-in-progress: false


jobs:

  deploy:

    runs-on: ubuntu-latest

    env:
      GODADDY_HOST: 1176735.us17.ssh.myftpupload.com
      GODADDY_USER: git_deployer_7ed4fc4a31_1176735
      GODADDY_ROOT: /html


    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # PREPARE SSH
      # ============================================================

      - name: Prepare SSH connection
        run: |
          mkdir -p ~/.ssh

          KEY="$RUNNER_TEMP/godaddy_key"

          printf '%s\n' '${{ secrets.PRIVATE_KEY }}' > "$KEY"

          chmod 600 "$KEY"

          echo "KEY=$KEY" >> "$GITHUB_ENV"


          echo "Checking GoDaddy SSH endpoint..."

          SUCCESS=0

          for i in 1 2 3 4; do

            echo "SSH check attempt $i/4..."

            if ssh-keyscan -T 8 -H "$GODADDY_HOST" \
              >> ~/.ssh/known_hosts 2>/dev/null; then

              echo "GoDaddy SSH endpoint responded."
              SUCCESS=1
              break

            fi

            if [ "$i" -lt 4 ]; then
              sleep 15
            fi

          done


          if [ "$SUCCESS" -ne 1 ]; then

            echo "::error::Could not obtain SSH host key from $GODADDY_HOST"

            exit 1

          fi


      # ============================================================
      # VERIFY SSH LOGIN
      # ============================================================

      - name: Verify SSH authentication
        run: |
          ssh \
            -i "$KEY" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$GODADDY_USER@$GODADDY_HOST" \
            '
              echo "SSH authentication successful"
              echo "Current directory:"
              pwd
              echo "HTML root:"
              ls -ld /html
            '


      # ============================================================
      # PHP CHECKS
      # ============================================================

      - name: Validate PHP files
        run: |
          if command -v php >/dev/null 2>&1; then

            find . \
              -type f \
              -name "*.php" \
              -not -path "./.git/*" \
              -print0 |
            while IFS= read -r -d '' file; do

              echo "Checking $file"

              php -l "$file"

            done

          else

            echo "PHP CLI unavailable on runner — skipping PHP lint."

          fi


      # ============================================================
      # DEPLOY
      # ============================================================

      - name: Deploy files to GoDaddy
        run: |

          echo "Deploying repository to $GODADDY_ROOT ..."


          rsync \
            -azv \
            --checksum \
            --itemize-changes \
            \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='node_modules/' \
            --exclude='README' \
            --exclude='README.md' \
            --exclude='Thumbs.db' \
            --exclude='.DS_Store' \
            \
            -e "ssh -i $KEY -o StrictHostKeyChecking=yes" \
            \
            ./ \
            "$GODADDY_USER@$GODADDY_HOST:$GODADDY_ROOT/"


          echo "Deployment completed."


      # ============================================================
      # VERIFY DEPLOYMENT
      # ============================================================

      - name: Verify deployed files
        run: |

          ssh \
            -i "$KEY" \
            -o StrictHostKeyChecking=yes \
            "$GODADDY_USER@$GODADDY_HOST" \
            '
              set -e

              echo "Checking production directory..."

              cd /html

              echo
              echo "index.html:"
              ls -lh index.html || true

              echo
              echo "mailer.php:"
              ls -lh mailer.php || true

              echo
              echo "check-ip.php:"
              ls -lh check-ip.php || true

              echo
              echo ".htaccess:"
              ls -lh .htaccess || true

              echo
              echo "PHP syntax check:"

              if [ -f /html/mailer.php ]; then
                  php -l /html/mailer.php
              fi

              if [ -f /html/check-ip.php ]; then
                  php -l /html/check-ip.php
              fi

              echo
              echo "Production verification complete."
            '


      # ============================================================
      # CLEAN LOCAL SSH KEY
      # ============================================================

      - name: Remove temporary SSH key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/godaddy_key"