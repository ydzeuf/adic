name: Deploy ADIC site to GoDaddy

# Auto-deploy on every push to main; also runnable manually from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deployment_dest:
        description: 'Target server directory, leave blank for root directory'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # PREFLIGHT — can this runner reach GoDaddy's SSH deploy endpoint at all?
      #
      # The GoDaddy deployer's very first sub-step runs `ssh-keyscan` under
      # `bash -e`. When the host does not answer, that dies with a bare
      # "Process completed with exit code 1" and no message (2026-09-15
      # outage) — which looks like a config/key problem but is not: the
      # runner simply cannot open a TCP connection to port 22.
      # (Real cause on 2026-09-15: GoDaddy silently renamed the site's temporary
      # SSH domain rp4.311.myftpupload.com -> 1176735.us17.ssh.myftpupload.com.
      # The current hostname is shown in Hosting Settings -> SSH/SFTP; update
      # HOST below AND remote_host in the deploy step together.)
      #
      # This step retries for ~2 minutes to absorb short blips, then, if the
      # endpoint is still unreachable, FAILS FAST with a plain-English error
      # and evidence (DNS, port 22 vs 443). Nothing in this repo or its
      # secrets can fix that case: re-run the job later, or send this log to
      # GoDaddy support.
      # -----------------------------------------------------------------------
      - name: Preflight — check GoDaddy SSH endpoint is reachable
        env:
          HOST: 1176735.us17.ssh.myftpupload.com
        run: |
          echo "DNS for $HOST:"
          getent ahosts "$HOST" || echo "::warning::DNS lookup for $HOST failed on this runner"

          # Gate with the SAME tool and timeout the deployer uses (ssh-keyscan,
          # 5 s banner timeout). A healthy host prints its keys to stdout and
          # exits 0; an unreachable or silent one prints nothing and exits 1.
          for i in 1 2 3 4; do
            if ssh-keyscan -T 5 -H "$HOST" > "$RUNNER_TEMP/hk" 2> "$RUNNER_TEMP/hk.err" && [ -s "$RUNNER_TEMP/hk" ]; then
              echo "OK: got SSH host key from $HOST:22 (attempt $i) — proceeding to deploy."
              exit 0
            fi
            echo "attempt $i/4: no SSH host key from $HOST:22"
            cat "$RUNNER_TEMP/hk.err" 2>/dev/null || true
            if [ "$i" -lt 4 ]; then sleep 30; fi
          done

          # --- Explain the failure (informational). Keep `exec` as the ONLY
          #     command inside each bash -c string: its status IS the probe result.
          tcp() { timeout -k 5 15 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null; }
          echo "Diagnostics:"
          if tcp "$HOST" 22; then
            echo "  $HOST:22   TCP connect OK but no SSH banner within 5 s => gateway up, sshd behind it not answering"
          else
            echo "  $HOST:22   no TCP connect at all (filtered / dropped)"
          fi
          tcp "$HOST" 80  && echo "  $HOST:80   open" || echo "  $HOST:80   no answer"
          tcp "$HOST" 443 && echo "  $HOST:443  open" || echo "  $HOST:443  no answer"

          if tcp github.com 22; then
            echo "  control github.com:22 reachable => this runner CAN do outbound SSH; the problem is specific to the GoDaddy endpoint."
            echo "::error::GoDaddy SSH endpoint $HOST:22 is not answering from this GitHub runner (4 tries over ~2 min) while github.com:22 works. This is on GoDaddy's side (GoDaddy renamed the temporary SSH domain — check Hosting Settings → SSH/SFTP for the current hostname — or SSH switched OFF / sshd down / port 22 firewalled) — NOT a workflow, key or secret problem. Fix the hostname if it changed, re-run, or send this log to GoDaddy support."
          else
            echo "  control github.com:22 ALSO unreachable => this runner has no port-22 egress at all."
            echo "::error::This GitHub runner cannot reach ANY SSH endpoint (github.com:22 failed too) — a GitHub Actions / runner network problem, not GoDaddy. Re-run the job."
          fi
          exit 1

      - name: Deploy files directly to GoDaddy
        env:
          SSH_HOST: "1176735.us17.ssh.myftpupload.com"
          SSH_USER: "git_deployer_7ed4fc4a31_1176735"
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

        run: |
          set -euo pipefail

          KEY="$RUNNER_TEMP/godaddy_key"
          KNOWN_HOSTS="$RUNNER_TEMP/known_hosts"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"

          ssh-keyscan -T 10 -H "$SSH_HOST" > "$KNOWN_HOSTS"

          # ---------------------------------------------------------
          # One SSH configuration used for BOTH ssh and rsync
          # ---------------------------------------------------------

          SSH_CMD="ssh -i $KEY \
          -o UserKnownHostsFile=$KNOWN_HOSTS \
          -o StrictHostKeyChecking=yes \
          -o ConnectTimeout=15 \
          -o ServerAliveInterval=10 \
          -o ServerAliveCountMax=3"

          echo "Testing SSH command access..."

          SSH_OK=0

          for i in 1 2 3 4 5; do

            echo "SSH login attempt $i/5..."

            if $SSH_CMD \
              "$SSH_USER@$SSH_HOST" \
              'echo "SSH OK"; test -d /html && echo "/html OK"'
            then

              SSH_OK=1
              break

            fi

            echo "SSH attempt $i failed."

            if [ "$i" -lt 5 ]; then
              echo "Waiting 30 seconds before retry..."
              sleep 30
            fi

          done


          if [ "$SSH_OK" -ne 1 ]; then

            echo "::error::GoDaddy SSH repeatedly closed the authenticated session."
            exit 1

          fi


          echo "Deploying repository files..."

          rsync \
            -rz \
            --checksum \
            --itemize-changes \
            --omit-dir-times \
            --no-perms \
            --no-owner \
            --no-group \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.adic-mailer-secrets.php' \
            --exclude='node_modules/' \
            --exclude='Thumbs.db' \
            --exclude='.DS_Store' \
            --exclude='index.php' \
            --exclude='wp-content/' \
            -e "$SSH_CMD" \
            ./ \
            "$SSH_USER@$SSH_HOST:/html/"


          rm -f "$KEY"

          echo "Direct deployment completed."      
      - name: Install private mailer configuration
        env:
          SSH_HOST: "1176735.us17.ssh.myftpupload.com"
          SSH_USER: "git_deployer_7ed4fc4a31_1176735"

          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SENDER_EMAIL: ${{ secrets.RESEND_SENDER_EMAIL }}
          ADIC_INSTRUCTOR_EMAIL: ${{ secrets.ADIC_INSTRUCTOR_EMAIL }}

        run: |
          set -euo pipefail

          echo "Preparing private mail configuration..."

          KEY="$RUNNER_TEMP/godaddy_key"
          CONFIG="$RUNNER_TEMP/.adic-mailer-secrets.php"
          KNOWN_HOSTS="$RUNNER_TEMP/known_hosts"

          # ---------------------------------------------------------
          # Prepare SSH key
          # ---------------------------------------------------------

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"


          # ---------------------------------------------------------
          # Trust current GoDaddy SSH host
          # ---------------------------------------------------------

          ssh-keyscan \
            -T 10 \
            -H "$SSH_HOST" \
            > "$KNOWN_HOSTS"


          # ---------------------------------------------------------
          # Build the PHP config WITHOUT printing secrets
          # ---------------------------------------------------------

          python3 <<'PY'
          import os
          from pathlib import Path

          def php_string(value):
              value = value.replace("\\", "\\\\")
              value = value.replace("'", "\\'")
              value = value.replace("\r", "\\r")
              value = value.replace("\n", "\\n")
              return "'" + value + "'"

          api_key = os.environ["RESEND_API_KEY"]
          sender = os.environ["RESEND_SENDER_EMAIL"]
          instructor = os.environ["ADIC_INSTRUCTOR_EMAIL"]

          content = """<?php

          return [
                'resend_api_key'   => %s,
                'sender_email'     => %s,
                'instructor_email' => %s
          ];
          """ % (
              php_string(api_key),
              php_string(sender),
              php_string(instructor)
          )

          Path(
              os.environ["RUNNER_TEMP"] + "/.adic-mailer-secrets.php"
          ).write_text(
              content,
              encoding="utf-8"
          )
          PY


          # ---------------------------------------------------------
          # Upload PRIVATE config directly to GoDaddy
          # ---------------------------------------------------------

          scp \
            -i "$KEY" \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            -o StrictHostKeyChecking=yes \
            "$CONFIG" \
            "$SSH_USER@$SSH_HOST:/html/.adic-mailer-secrets.php"


          # ---------------------------------------------------------
          # Secure + verify it
          # ---------------------------------------------------------

          ssh \
            -i "$KEY" \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            '
              chmod 600 /html/.adic-mailer-secrets.php

              echo "Checking private mail configuration..."

              php -l /html/.adic-mailer-secrets.php

              php -r '\''
                $c = require "/html/.adic-mailer-secrets.php";

                echo !empty($c["resend_api_key"])
                    ? "Email API key: OK\n"
                    : "Email API key: MISSING\n";

                echo !empty($c["sender_email"])
                    ? "Sender email: OK\n"
                    : "Sender email: MISSING\n";

                echo !empty($c["instructor_email"])
                    ? "Instructor email: OK\n"
                    : "Instructor email: MISSING\n";
              '\''
            '


          # ---------------------------------------------------------
          # Remove temporary copies from GitHub runner
          # ---------------------------------------------------------

          rm -f "$KEY"
          rm -f "$CONFIG"

          echo "Private mailer configuration installed successfully."